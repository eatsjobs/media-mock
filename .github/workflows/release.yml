name: Release Workflow

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Job for testing and coverage report
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install playwright
        run: pnpm exec playwright install --with-deps

      - name: Run tests with coverage
        run: pnpm test-coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Report
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job for releasing package on push to main with a git tag
  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node >= 22.14 is required for npm OIDC trusted publishing
          node-version: '24'
          cache: 'pnpm'

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1, which is newer
      # than the npm bundled with Node. changeset publish shells out to this
      # global npm, so it must be upgraded here.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No NPM_TOKEN: authentication is handled by OIDC trusted publishing.
      # The npm CLI detects the GitHub Actions OIDC environment automatically
      # and exchanges the id-token for a short-lived publish credential.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          createGithubReleases: true
          commit: "chore: version bump"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish on JSR 
        id: jsr-publish
        run: |
          # Extract the version from package.json
          VERSION=$(jq -r '.version' package.json)
          
          # Update jsr.json with the extracted version
          jq --arg version "$VERSION" '.version = $version' jsr.json > tmp.json && mv tmp.json jsr.json

          git add jsr.json
          git commit -m "chore: update jsr.json version to $VERSION" || echo "No changes to commit"
          pnpm dlx jsr publish