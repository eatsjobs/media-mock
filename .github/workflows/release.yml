name: Release Workflow

on:
  push:
    branches:
      - main
  # Lets a release be retried without an empty commit. A publish that npm did
  # not actually record leaves nothing to push, and `pnpm release` checks the
  # registry first, so re-running is safe either way.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Job for testing and coverage report
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install playwright
        run: pnpm exec playwright install --with-deps

      - name: Run tests with coverage
        run: pnpm test-coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Report
        if: ${{ !cancelled() }}
        # Still a node20 action: Codecov has shipped no Node 24 release of
        # this one, so it keeps warning until they do.
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job for releasing package on push to main with a git tag
  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Node >= 22.14 is required for npm OIDC trusted publishing
          node-version: '24'
          cache: 'pnpm'

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1, which is newer
      # than the npm bundled with Node. changeset publish shells out to this
      # global npm, so it must be upgraded here.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No NPM_TOKEN: authentication is handled by OIDC trusted publishing.
      # The npm CLI detects the GitHub Actions OIDC environment automatically
      # and exchanges the id-token for a short-lived publish credential.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          createGithubReleases: true
          commit: "chore: version bump"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Only when the step above actually published. When there are changesets
      # waiting it opens the release PR instead — but it still runs
      # `changeset version` in the working tree to build that PR, leaving
      # package.json holding a version that was never released. Publishing that
      # to JSR is how JSR came to sit two versions ahead of npm.
      - name: Publish on JSR
        id: jsr-publish
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Safe to read now: a publish leaves package.json at the released version.
          VERSION=$(jq -r '.version' package.json)
          PACKAGE=$(jq -r '.name' jsr.json)

          # Idempotent, so a re-run cannot fail on a version JSR already holds.
          if curl -sf "https://jsr.io/$PACKAGE/meta.json" \
            | jq -e --arg v "$VERSION" '.versions | has($v)' > /dev/null; then
            echo "$PACKAGE@$VERSION is already on JSR; nothing to publish."
            exit 0
          fi

          jq --arg version "$VERSION" '.version = $version' jsr.json > tmp.json && mv tmp.json jsr.json

          # jsr publish refuses a dirty tree; this commit stays on the runner.
          git add jsr.json
          git commit -m "chore: update jsr.json version to $VERSION" || echo "No changes to commit"
          pnpm dlx jsr publish