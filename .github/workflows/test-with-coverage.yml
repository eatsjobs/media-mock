name: Test with Coverage

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.60 refuses to install
    # browsers on. Unpin once the installed Playwright supports it.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install playwright
        run: pnpm exec playwright install --with-deps

      - name: Run Tests with Coverage
        run: pnpm test-coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Report
        if: ${{ !cancelled() }}
        # Still a node20 action: Codecov has shipped no Node 24 release of
        # this one, so it keeps warning until they do.
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}